name: Release

on:
  push:
    branches:
      - main
    # `v*`, not `*`: this repo carries two independent tag series. Package
    # releases are `v1.4.0`; ontology releases are `celine-ontology-v0.8`. Under
    # `*` an ontology tag ran this workflow too, which rebuilt whatever version
    # pyproject happened to hold and tried to publish it — PyPI answered
    # `400 Bad Request` because that version was already uploaded. Ontology tags
    # do not start with `v`, so this filter separates the two series exactly.
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  build:
    name: Build Wheel and SDist
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.baipp.outputs.package_name }}
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Packages
          path: dist
      - name: Publish to PyPI
        # v1.14.2, not v1.13.0: hatchling now emits `Metadata-Version: 2.5`, and
        # the Twine bundled in v1.13.0 rejects it —
        # `InvalidDistribution: '2.5' is not a valid metadata version`. That is
        # what silently stopped 1.9.0 and 1.10.0 from ever reaching PyPI while
        # the tag, the changelog and the GitHub release all looked fine. v1.14.2
        # bundles Twine 7, which accepts it.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
