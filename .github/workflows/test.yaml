### Test celine-ontologies across every Python version it claims to support.
#
# The matrix is not written here — it is read from the `Programming Language ::
# Python :: 3.x` classifiers in `pyproject.toml`, via the
# `supported_python_classifiers_json_array` output of
# `build-and-inspect-python-package`. The classifiers are the single declaration
# of the supported range and this workflow is what makes them true rather than
# aspirational; there is no second list to forget.
#
# Why it exists: this package declared `requires-python = ">=3.12"` while its
# dependencies were `jsonschema` and `pyyaml`, which have supported 3.8 for
# years. Nothing had ever checked, and the floor propagated to `dataset-api`.

name: Test celine-ontologies

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp

  pytest:
    name: Test on ${{ matrix.python-version }}
    needs: [build-package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `--all-extras`: `mapper` and `cli` carry the heavier dependencies
      # (rdflib, pyshacl), and those are exactly where a version floor would
      # appear. Testing only the core would leave the claim unproven.
      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --no-dev --group test --all-extras

      # A version-gated import can sit in a module no test touches — that is how
      # `celine-sdk` lost two of 553 submodules without any suite noticing.
      - name: Import every submodule
        run: |
          uv run --python ${{ matrix.python-version }} python - <<'EOF'
          import importlib, pkgutil, sys
          failed, total = [], 0
          for root in ("celine.ontologies", "celine.mapper"):
              pkg = importlib.import_module(root)
              names = [root] + [m.name for m in pkgutil.walk_packages(pkg.__path__, root + ".")]
              total += len(names)
              for name in names:
                  try:
                      importlib.import_module(name)
                  except Exception as exc:
                      failed.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"imported {total - len(failed)}/{total} submodules")
          for f in failed:
              print("::error::" + f)
          sys.exit(1 if failed else 0)
          EOF

      - name: Run the suite
        run: uv run --python ${{ matrix.python-version }} pytest -q
