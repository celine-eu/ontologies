[project]
name = "celine-ontologies"
version = "1.9.0"
description = "CELINE Ontologies support libraries"
readme = "README.md"
requires-python = ">=3.10"

# The supported range, proven rather than assumed: `test.yml` builds its matrix
# from these classifiers, so a version listed here is a version CI runs.
#
# The floor was `>=3.12` with nothing behind it — the runtime dependencies are
# `jsonschema` and `pyyaml`, which have supported 3.8 for years, and the extras
# (`rdflib`, `pyshacl`, `typer`, `httpx`) do not push it either. Dependency
# resolution succeeds as low as 3.9; 3.10 is chosen to match the rest of the
# platform rather than because 3.9 fails. The old floor reached `dataset-api`,
# which had no need of it.
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "jsonschema>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mapper = [
    "rdflib>=7.5.0",
    "pyshacl>=0.26.0",
]
cli = [
    "typer>=0.21.1",
    "httpx>=0.28.1",
    "rdflib>=7.5.0",
]
all = [
    "celine-ontologies[mapper,cli]",
]

[dependency-groups]
# `test` is what the CI matrix installs and must work on every supported
# version; `dev` adds release tooling that only runs on a maintainer's machine.
# Keeping them apart stops a tool's own floor from dictating the package's.
test = [
    "pytest>=9.0.2",
]
dev = [
    { include-group = "test" },
    "python-semantic-release>=10.5.3; python_version >= '3.11'",
]

[tool.uv]  # optional, helps uv handle locking
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/mapper", "src/celine/ontologies"]
sources = {"src" = ""}

# The vocabulary registry is a runtime artifact, not just documentation:
# consumers expand CURIEs from mapping specs through its prefix->namespace map
# (dataset-api derives its JSON-LD contexts from it). It sits at the repo root,
# outside `only-include`, so it needs force-including to reach the wheel.
#
# The cost, accepted deliberately: a tagged celine-ontologies release now tracks
# registry updates. The alternative was fetching it published at startup, which
# makes a cold boot depend on an external host.
#
# The ontology profiles are force-included for the same reason and at a larger
# scale: `specs/` sits outside `only-include`, so `CelineGraphBuilder`'s defaults
# resolved to `<site-packages>/specs/current` — a path that cannot exist in a
# deployment — and every installed consumer failed at construction. Shapes now
# travel with the library that produces the graph they validate.
#
# Three versions, not one. A dataset pins the version its mapping was written
# against (see `profile` in mapping_spec.schema.json); a newer ontology release
# must not retroactively invalidate it, so the window has to hold more than
# `current`. Dropping or adding a version is an edit to this block and nothing
# else.
#
# Only the four machine-consumed files per version. `README.md`, `widoco.conf`,
# `sections/` and `examples/` are documentation inputs and stay out — listing
# files rather than copying directories is what keeps that true by construction.
#
# `specs/current/` is deliberately absent: it is a byte copy of the newest
# version, so packaging it would ship the same bytes twice and give "which
# version is this" two answers. `current` is a resolution rule in profiles.py —
# the highest packaged version — not a directory.
#
# The destination is `ontology_profiles/`, not `profiles/`, because
# `celine/mapper/profiles.py` is a module: a sibling directory of the same name
# is a namespace-package portion competing with it for the import name.
[tool.hatch.build.targets.wheel.force-include]
"open-repository.yaml" = "celine/mapper/open-repository.yaml"

"specs/v0.8/celine.ttl" = "celine/mapper/ontology_profiles/celine/v0.8/ontology.ttl"
"specs/v0.8/celine.shacl.ttl" = "celine/mapper/ontology_profiles/celine/v0.8/shapes.ttl"
"specs/v0.8/celine.jsonld" = "celine/mapper/ontology_profiles/celine/v0.8/context.jsonld"
"specs/v0.8/celine.schema.json" = "celine/mapper/ontology_profiles/celine/v0.8/schema.json"

"specs/v0.9/celine.ttl" = "celine/mapper/ontology_profiles/celine/v0.9/ontology.ttl"
"specs/v0.9/celine.shacl.ttl" = "celine/mapper/ontology_profiles/celine/v0.9/shapes.ttl"
"specs/v0.9/celine.jsonld" = "celine/mapper/ontology_profiles/celine/v0.9/context.jsonld"
"specs/v0.9/celine.schema.json" = "celine/mapper/ontology_profiles/celine/v0.9/schema.json"

"specs/v0.10/celine.ttl" = "celine/mapper/ontology_profiles/celine/v0.10/ontology.ttl"
"specs/v0.10/celine.shacl.ttl" = "celine/mapper/ontology_profiles/celine/v0.10/shapes.ttl"
"specs/v0.10/celine.jsonld" = "celine/mapper/ontology_profiles/celine/v0.10/context.jsonld"
"specs/v0.10/celine.schema.json" = "celine/mapper/ontology_profiles/celine/v0.10/schema.json"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true


[project.scripts]
celine-ontologies = "celine.ontologies.main:run"


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
update_pyproject_toml = true 
commit_parser = "conventional"

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "chore"]
parse_squash_commits = true
ignore_merge_commits = true

