abstract=The CELINE Core Ontology is a lightweight orchestration profile for Renewable Energy Communities (RECs) and Digital Twin workflows. It connects established standards -- PECO, SAREF, SAREF4ENER, SOSA/SSN -- without redefining their domain semantics, providing a minimal coordination layer for simulation scenarios, dataset references, KPI definition and evaluation, flexibility commitment and settlement, grid topology, and member classification within the CELINE platform.

introduction=CELINE (Cross-sectorial integrated digital services Enabling energy Localized INnovation and community Empowerment) is a Horizon Europe research project (Grant Agreement No. 101160667) that develops a Digital Toolbox for households, energy communities and cooperative organisations to optimise energy management and support investment decisions around photovoltaic systems, battery storage, electric vehicles and heat pumps. The project validates its solutions across three European demonstration sites in Spain, Finland and Italy.\n\nThe CELINE Core Ontology supports the semantic layer of this toolbox. It is a thin orchestration profile -- not a standalone domain ontology -- that binds together existing standards into a coherent semantic target for the CELINE ecosystem:\n\n- **PECO** (https://purl.org/peco) models the Energy Community structure, members, PODs and assets.\n- **SAREF / SAREF4ENER** (ETSI) covers smart devices and energy assets.\n- **SOSA/SSN** (W3C) covers sensor observations and measurements.\n- **IEC CIM** (IEC 61968) provides the reference model for grid topology, aligned via skos:closeMatch.\n\nVersion 0.6 extends the ontology with:\n\n- **Grid topology**: Substation hierarchy (Primary/Secondary), PowerTransformer, DistributionFeeder, RegulatoryZone, and the GridOperator actor, aligned to the IEC CIM profile via skos:closeMatch.\n- **Connection points**: A generalised ConnectionPoint superclass for PECO Electric_POD, with a ConnectionPointIdentifierScheme vocabulary covering six European national metering-point standards (POD, CUPS, PRM, MALO, EAN, MPAN).\n- **Presence-only asset inventory**: PVSystem, BatteryStorage, ElectricityMeter, EVCharger, HeatPump -- typed classes with no technical-attribute properties. Asset specifications live in the external rec-registry catalogue, addressed by celine:hasLocalIdentifier.\n- **Member classification**: MemberRole (Consumer, Prosumer, Producer, Operator, Admin) and MemberStatus (Pending, Active, Suspended, Inactive) vocabularies with hasMember linkage from CommunityContext.\n- **Flexibility request**: FlexibilityRequest class closing the demand-response loop -- a demand signal from operator/system that triggers FlexibilityCommitments, with RequestStatus lifecycle tracking.\n\nProject website: https://www.celineproject.eu/\nSource code and issues: https://github.com/celine-eu\nDocumentation: https://celine-eu.github.io/

description=The ontology defines the following concept groups:\n\n**Core context and simulation** -- CommunityContext binds a PECO EnergyCommunity to its members, assets, datasets and simulations. Scenario captures assumptions and temporal scope; Simulation and SimulationRun model abstract definitions and concrete executions. DatasetReference is a lightweight pointer to external datasets.\n\n**KPI layer** -- KPIDefinition captures named, typed KPI metrics with scope, calculation method, temporal granularity and unit of measure. KPIEvaluation records the computed value for a specific scope entity and time interval. A KPICatalog provides 11 initial REC-relevant KPI entries.\n\n**Flexibility and settlement** -- FlexibilityRequest is the demand signal; FlexibilityCommitment is a member's pledge to deliver flexibility on specific PODs; FlexibilityCredit is the metered credit earned. FlexibilityEnvelope declares POD-level capability bounds; FlexibilityConstraint encodes activation rules. SettlementRun aggregates credits, applies costs (CostItem), and produces per-member RedistributionResults.\n\n**Grid topology** -- Substation (Primary/Secondary), PowerTransformer, DistributionFeeder model the distribution network. RegulatoryZone represents administrative coverage areas. GridOperator models the DSO. ConnectionPoint generalises the PECO Electric_POD for multi-country portability.\n\n**Asset inventory** -- PVSystem, BatteryStorage, ElectricityMeter, EVCharger, HeatPump are presence-only typed classes. Technical specifications are deliberately omitted; they live in the rec-registry external catalogue, linked via celine:hasLocalIdentifier.\n\n**Member classification** -- MemberRole and MemberStatus SKOS vocabularies classify members within their energy community, following the rec-registry single-community-per-member model.\n\nAll cross-domain links to PECO, SAREF, SOSA and IEC CIM are expressed via skos:closeMatch annotations or lightweight object properties -- no external ontology is subclassed or redefined beyond PECO predicates already imported.

