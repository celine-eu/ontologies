abstract=The CELINE Core Ontology is a lightweight orchestration profile for Renewable Energy Communities (RECs) and Digital Twin workflows. It connects established standards -- PECO, SAREF, SAREF4ENER, SOSA/SSN, QUDT and IEC CIM -- without redefining their domain semantics, providing a minimal coordination layer for simulation scenarios, dataset references, KPI definition and evaluation, flexibility commitment and settlement, grid topology, energy observation and member classification within the CELINE platform.

introduction=CELINE (Cross-sectorial integrated digital services Enabling energy Localized INnovation and community Empowerment) is a Horizon Europe research project (Grant Agreement No. 101160667) that develops a Digital Toolbox for households, energy communities and cooperative organisations to optimise energy management and support investment decisions around photovoltaic systems, battery storage, electric vehicles and heat pumps. The project validates its solutions across three European demonstration sites in Spain, Finland and Italy.\n\nThe CELINE Core Ontology supports the semantic layer of this toolbox. It is a thin orchestration profile -- not a standalone domain ontology -- that binds together existing standards into a coherent semantic target for the CELINE ecosystem:\n\n- **PECO** (https://purl.org/peco) models the Energy Community structure, members, PODs and assets.\n- **SAREF / SAREF4ENER** (ETSI) covers smart devices and energy assets.\n- **SOSA/SSN** (W3C) covers sensor observations and measurements.\n- **QUDT** supplies quantity kinds and units for observation results.\n- **IEC CIM** (CIM100) provides the reference model for grid topology, aligned via skos:closeMatch.\n\nVersion 0.10 adds the observable properties a REC energy dataset actually reports:\n\n- **Six sosa:ObservableProperty individuals**: GridImportEnergy, GridExportEnergy, SelfConsumedEnergy, CollectivelySharedEnergy, VirtualConsumedEnergy and SelfConsumptionRatio, each carrying qudt:hasQuantityKind. They give sosa:observedProperty a target that resolves. These are CELINE terms because no standard has them: quantitykind:Energy is the right quantity kind for five of the six and is asserted on each, but it does not distinguish energy drawn from the grid from energy fed into it, and that distinction is the whole content of a REC settlement.\n- **SOSA rather than SAREF for the observation structure**: saref:Measurement is deprecated in SAREF core v3.2.1 in favour of saref:Observation and convergence with SOSA/SSN, taking saref:Energy and the unit individuals with it. SOSA also supplies sosa:hasSimpleResult, the sanctioned way to put a literal result on an observation without an intermediate node a flat data row cannot mint. SAREF remains correct for the device side and CIM for the grid side.\n- **QUDT prefixes**: qudt, quantitykind and unit are bound, with no owl:imports added. Nothing already present supplied a unit -- SAREF's unit individuals are deprecated and celine:UnitOfMeasure is a four-concept SKOS scheme that resolves for nobody outside CELINE.\n- **rdfs:seeAlso to the KPI Catalog**: four of the six quantities already have a KPICatalog concept. A KPIDefinition is a period total or rate; an ObservableProperty is what one observation measures over one interval. The pairs are linked but kept distinct, which is why the shared-energy property is CollectivelySharedEnergy rather than SharedEnergy -- that IRI is a KPICatalog concept released in v0.5.\n- **celine:DefinedTermLabelShape**: a SHACL shape asserting sh:uniqueLang on rdfs:label and skos:prefLabel across every term the ontology defines, so that one IRI minted twice is reported rather than shipped. It uses sh:SPARQLTarget and therefore requires pyshacl advanced mode, as do the pre-existing concept shapes.\n\nVersion 0.9 is a conformance fix and introduces no new terms:\n\n- **CIM namespace**: The cim: prefix now binds to the IEC CIM100 namespace, http://iec.ch/TC57/CIM100#. It previously bound to https://ontology.tno.nl/IEC_CIM/ -- where TNO hosts a copy of CIM, not where CIM mints its terms -- so all seven skos:closeMatch alignments to CIM expanded to IRIs that do not exist. CIM is the one external vocabulary CELINE references on documentary rather than resolvable authority: IEC CIM is a paid standard and its namespace IRIs answer HTTP 403, so these alignments are checked against the published CIM100 class documentation.\n- **GridOperator alignment**: celine:GridOperator moves from cim:Company, which exists in no CIM version, to cim:Organisation. Note cim:Operator is a control-room person, not the operating company.\n\nVersion 0.8 was a conformance fix and introduced no new terms:\n\n- **SKOS top concepts**: The CommitmentMode, FlexibilityDirection, CostType and ConstraintType schemes now carry the skos:hasTopConcept assertions their SHACL shapes require. The concepts themselves already declared skos:inScheme and skos:topConceptOf, so only the scheme-side statement was missing. All four schemes are flat -- no skos:broader anywhere -- so every member is a top concept.\n- **Language tags**: Labels, prefLabels, descriptions and comments in those four schemes gain the @en tag already used by the other nine.\n\nVersion 0.7 extended the ontology with:\n\n- **hasDataset**: A new object property linking assets and connection points to external, self-describing datasources (DatasetReference). This is the operational counterpart to the SimulationRun-scoped usesDataset/producesDataset properties.\n- **DatasetReference self-description**: Clarified that instances SHOULD declare conformance target (dct:conformsTo), format (dct:format), and access location (dcat:accessURL or dct:source) using DCAT/Dublin Core terms. DCAT prefix added (no owl:imports).\n- **Implementation-neutral wording**: All references to specific external catalogue products have been replaced with generic wording (\"an external catalogue\") throughout the ontology.\n\nProject website: https://www.celineproject.eu/\nSource code and issues: https://github.com/celine-eu\nDocumentation: https://celine-eu.github.io/

description=The ontology defines the following concept groups:\n\n**Core context and simulation** -- CommunityContext binds a PECO EnergyCommunity to its members, assets, datasets and simulations. Scenario captures assumptions and temporal scope; Simulation and SimulationRun model abstract definitions and concrete executions. DatasetReference is a lightweight pointer to external datasets; instances declare their own conformance via dct:conformsTo and provide access details via DCAT/DCT terms.\n\n**KPI layer** -- KPIDefinition captures named, typed KPI metrics with scope, calculation method, temporal granularity and unit of measure. KPIEvaluation records the computed value for a specific scope entity and time interval. A KPICatalog provides 11 initial REC-relevant KPI entries.\n\n**Controlled vocabularies** -- All closed enumerations are SKOS ConceptSchemes. Every scheme declares its entry points with skos:hasTopConcept and each concept states the inverse with skos:topConceptOf; the schemes are flat, so the two sets coincide.\n\n**Flexibility and settlement** -- FlexibilityRequest is the demand signal; FlexibilityCommitment is a member's pledge to deliver flexibility on specific PODs; FlexibilityCredit is the metered credit earned. FlexibilityEnvelope declares POD-level capability bounds; FlexibilityConstraint encodes activation rules. SettlementRun aggregates credits, applies costs (CostItem), and produces per-member RedistributionResults.\n\n**Grid topology** -- Substation (Primary/Secondary), PowerTransformer, DistributionFeeder model the distribution network. RegulatoryZone represents administrative coverage areas. GridOperator models the DSO. ConnectionPoint generalises the PECO Electric_POD for multi-country portability.\n\n**Asset inventory** -- PVSystem, BatteryStorage, ElectricityMeter, EVCharger, HeatPump are presence-only typed classes. Technical specifications are deliberately omitted; they live in an external catalogue, linked via celine:hasLocalIdentifier. Assets and connection points may reference operational datasources via celine:hasDataset.\n\n**Member classification** -- MemberRole and MemberStatus SKOS vocabularies classify members within their energy community, following the upstream registry single-community-per-member model.\n\n**Forecasts** -- celine:Forecast is a sosa:Observation subclass, not a separate hierarchy: SOSA defines an Observation as the act of a Procedure to estimate or calculate a value, which a computed forecast is, and defines a Procedure as a reusable algorithm or computational method, which is what a forecasting model is. celine:ForecastModel is that Procedure, reached through sosa:usedProcedure, so the model behind a number is answerable after the fact. Prediction bounds (celine:hasLowerBound, celine:hasUpperBound) and the level they cover (celine:hasConfidence) sit on the forecast itself; celine:forecastTargetTime is a literal shortcut for sosa:phenomenonTime, in the same spirit as SOSA's own sosa:hasSimpleResult. Forecasts sharing a celine:ForecastRun are one series. The observable properties are shared with measurement rather than doubled, so forecast and actual compare like with like.\n\n**Energy observation** -- Seven sosa:ObservableProperty individuals name what a REC energy dataset reports: grid import and export, self-consumed energy, collectively shared energy, virtual consumed energy, the self-consumption ratio, and specific PV yield. Each carries a qudt:hasQuantityKind except celine:SpecificPVYield, whose kWh/kWp is energy over power: Energy and DimensionlessRatio are both false and Time reads as a duration, so none is asserted and the unit carries the meaning. The observation structure itself is SOSA's -- one sosa:Observation per quantity per interval, with sosa:hasSimpleResult and qudt:hasUnit -- and only the properties are minted here. Where a quantity also has a KPICatalog concept the two are linked with rdfs:seeAlso and kept distinct: the KPI is a period total or rate, the observable property is a single measurement.\n\nAll cross-domain links to PECO, SAREF, SOSA, QUDT and IEC CIM are expressed via skos:closeMatch annotations or lightweight object properties -- no external ontology is subclassed or redefined beyond PECO predicates already imported.

