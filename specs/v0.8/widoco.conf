abstract=The CELINE Core Ontology is a lightweight orchestration profile for Renewable Energy Communities (RECs) and Digital Twin workflows. It connects established standards -- PECO, SAREF, SAREF4ENER, SOSA/SSN -- without redefining their domain semantics, providing a minimal coordination layer for simulation scenarios, dataset references, KPI definition and evaluation, flexibility commitment and settlement, grid topology, and member classification within the CELINE platform.

introduction=CELINE (Cross-sectorial integrated digital services Enabling energy Localized INnovation and community Empowerment) is a Horizon Europe research project (Grant Agreement No. 101160667) that develops a Digital Toolbox for households, energy communities and cooperative organisations to optimise energy management and support investment decisions around photovoltaic systems, battery storage, electric vehicles and heat pumps. The project validates its solutions across three European demonstration sites in Spain, Finland and Italy.\n\nThe CELINE Core Ontology supports the semantic layer of this toolbox. It is a thin orchestration profile -- not a standalone domain ontology -- that binds together existing standards into a coherent semantic target for the CELINE ecosystem:\n\n- **PECO** (https://purl.org/peco) models the Energy Community structure, members, PODs and assets.\n- **SAREF / SAREF4ENER** (ETSI) covers smart devices and energy assets.\n- **SOSA/SSN** (W3C) covers sensor observations and measurements.\n- **IEC CIM** (IEC 61968) provides the reference model for grid topology, aligned via skos:closeMatch.\n\nVersion 0.8 is a conformance fix and introduces no new terms:\n\n- **SKOS top concepts**: The CommitmentMode, FlexibilityDirection, CostType and ConstraintType schemes now carry the skos:hasTopConcept assertions their SHACL shapes require. The concepts themselves already declared skos:inScheme and skos:topConceptOf, so only the scheme-side statement was missing. All four schemes are flat -- no skos:broader anywhere -- so every member is a top concept.\n- **Language tags**: Labels, prefLabels, descriptions and comments in those four schemes gain the @en tag already used by the other nine.\n\nVersion 0.7 extended the ontology with:\n\n- **hasDataset**: A new object property linking assets and connection points to external, self-describing datasources (DatasetReference). This is the operational counterpart to the SimulationRun-scoped usesDataset/producesDataset properties.\n- **DatasetReference self-description**: Clarified that instances SHOULD declare conformance target (dct:conformsTo), format (dct:format), and access location (dcat:accessURL or dct:source) using DCAT/Dublin Core terms. DCAT prefix added (no owl:imports).\n- **Implementation-neutral wording**: All references to specific external catalogue products have been replaced with generic wording (\"an external catalogue\") throughout the ontology.\n\nProject website: https://www.celineproject.eu/\nSource code and issues: https://github.com/celine-eu\nDocumentation: https://celine-eu.github.io/

description=The ontology defines the following concept groups:\n\n**Core context and simulation** -- CommunityContext binds a PECO EnergyCommunity to its members, assets, datasets and simulations. Scenario captures assumptions and temporal scope; Simulation and SimulationRun model abstract definitions and concrete executions. DatasetReference is a lightweight pointer to external datasets; instances declare their own conformance via dct:conformsTo and provide access details via DCAT/DCT terms.\n\n**KPI layer** -- KPIDefinition captures named, typed KPI metrics with scope, calculation method, temporal granularity and unit of measure. KPIEvaluation records the computed value for a specific scope entity and time interval. A KPICatalog provides 11 initial REC-relevant KPI entries.\n\n**Controlled vocabularies** -- All closed enumerations are SKOS ConceptSchemes. Every scheme declares its entry points with skos:hasTopConcept and each concept states the inverse with skos:topConceptOf; the schemes are flat, so the two sets coincide.\n\n**Flexibility and settlement** -- FlexibilityRequest is the demand signal; FlexibilityCommitment is a member's pledge to deliver flexibility on specific PODs; FlexibilityCredit is the metered credit earned. FlexibilityEnvelope declares POD-level capability bounds; FlexibilityConstraint encodes activation rules. SettlementRun aggregates credits, applies costs (CostItem), and produces per-member RedistributionResults.\n\n**Grid topology** -- Substation (Primary/Secondary), PowerTransformer, DistributionFeeder model the distribution network. RegulatoryZone represents administrative coverage areas. GridOperator models the DSO. ConnectionPoint generalises the PECO Electric_POD for multi-country portability.\n\n**Asset inventory** -- PVSystem, BatteryStorage, ElectricityMeter, EVCharger, HeatPump are presence-only typed classes. Technical specifications are deliberately omitted; they live in an external catalogue, linked via celine:hasLocalIdentifier. Assets and connection points may reference operational datasources via celine:hasDataset.\n\n**Member classification** -- MemberRole and MemberStatus SKOS vocabularies classify members within their energy community, following the upstream registry single-community-per-member model.\n\nAll cross-domain links to PECO, SAREF, SOSA and IEC CIM are expressed via skos:closeMatch annotations or lightweight object properties -- no external ontology is subclassed or redefined beyond PECO predicates already imported.

