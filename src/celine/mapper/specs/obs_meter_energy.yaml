# ⚠ SUPERSEDED by obs_energy_measurement.yaml — do not bind new datasets to this.
#
# This spec maps a wide row onto a single sosa:Observation, which SSN forbids:
# an Observation carries exactly one sosa:observedProperty. The second and third
# quantities are therefore parked on `peco:has_quantity` and `rdf:value`, which
# are not "the second result" — they were reached for because the row had
# nowhere else to put the numbers. Nothing dereferences that and no test
# contradicts it.
#
# Kept, unbound, because the graph-builder tests and fixtures exercise it. The
# replacement takes one quantity per row from the `*_measurements_*` views in
# celine-pipelines. See obs_energy_measurement.yaml for the full reasoning.
#
# Maps rows from ds_dev_gold.meters_data_15m
# (fetcher: meters_data) to sosa:Observation nodes.
#
# Source columns: _id, device_id, ts, consumption_kwh, production_kwh, self_consumed_kwh
#
# Corrected 2026-08-09: the model emits kWh, not kW. Energy, not power — and
# xsd:decimal carries no unit to contradict a wrong reading.
version: "1"

# The ontology profile whose shapes validate this mapping's output. Pinned,
# not left to resolve: a dataset bound to this spec asserts conformance
# against these shapes, and a later ontology release must not decide
# retroactively that it stopped conforming.
profile:
  name: celine
  version: v0.10
target_type: "sosa:Observation"
id_template: "https://w3id.org/celine/obs/meter/{device_id}/{ts}"

fields:
  - source: _id
    target: "dct:identifier"
    datatype: xsd:string

  - source: ts
    target: "sosa:resultTime"
    datatype: xsd:dateTime
    required: true

  - source: consumption_kwh
    target: "sosa:hasSimpleResult"
    datatype: xsd:decimal

  - source: production_kwh
    target: "peco:has_quantity"
    datatype: xsd:decimal

  - source: self_consumed_kwh
    target: "rdf:value"
    datatype: xsd:decimal

  # Sensor: link to saref:Device node
  - source: device_id
    target: "sosa:madeBySensor"
    kind: iri
    iri_template: "https://w3id.org/celine/device/{value}"
    required: true

  # Observed property: meter consumption
  - target: "sosa:observedProperty"
    kind: constant
    value: "https://w3id.org/celine/property/meter-consumption-kwh"
