# Maps one row of a PV potential *forecast* view to a celine:Forecast.
#
# Rewritten 2026-09-03 for ontology v0.11. This spec needed more than a new target
# type: four of its fields put values on properties that cannot carry them.
#
# ── What was wrong, recorded so it is not reintroduced ───────────────────────
#   lat               -> peco:has_property_kind        an OBJECT property,
#                                                      Property_of_interest -> Property
#   lon               -> peco:has_property_of_interest an OBJECT property
#   performance_ratio -> rdf:value                     a generic slot, already the
#                                                      dumping ground
#   asob_s_wm2        -> peco:has_quantity             belongs to peco:Value, and is
#                                                      an irradiation, not this
#
# Latitude is not a property kind. These survived because nothing validates them —
# the profile has no shape reaching this type, so the graph parsed, SHACL passed and
# the statements were nonsense.
#
# Coordinates are a decimal pair and belong on the **feature of interest**, whose
# type `geo:lat` names (geo:SpatialThing) — not on the forecast, which would infer a
# forecast is a place. v0.11 binds the WGS84 `geo:` prefix for that, referenced and
# not imported, as `time:` already is. The location is described once in its own
# entry and referenced here by `feature_iri`, which is also the delegation shape this
# project prefers for assets: describe the thing in a catalogue, point at it here.
#
# `performance_ratio` and `asob_s_wm2` are separate quantities. If they are worth
# keeping they are worth their own rows, from a view that unpivots them; parking
# them on this node is what the wide-row specs were deleted for.
#
# The observed property is `celine:SpecificPVYield`, minted in v0.11 — kWh per kWp,
# normalised by installed peak power so the figure is independent of plant size,
# which is the point: these datasets rank rooftops that do not exist yet. It is the
# one observable property with no qudt:hasQuantityKind, and the ontology says why.
# Taken from a column all the same, for the same reason as the other two specs.
#
# Source columns: run_time, forecast_target_time, observed_property, value, unit,
#                 lower_bound, upper_bound, confidence, model_iri, run_iri,
#                 feature_iri, provider
version: "2"

profile:
  name: celine
  version: v0.11

target_type: "celine:Forecast"

id_template: "forecast/pv/{{ feature_key }}/{{ run_time }}/{{ forecast_target_time }}"

fields:
  - source: run_time
    target: "sosa:resultTime"
    datatype: xsd:dateTime
    required: true

  - source: forecast_target_time
    target: "celine:forecastTargetTime"
    datatype: xsd:dateTime
    required: true

  - source: observed_property
    target: "sosa:observedProperty"
    kind: iri
    required: true

  - source: value
    target: "sosa:hasSimpleResult"
    datatype: xsd:decimal

  - source: unit
    target: "qudt:hasUnit"
    kind: iri

  - source: lower_bound
    target: "celine:hasLowerBound"
    datatype: xsd:decimal

  - source: upper_bound
    target: "celine:hasUpperBound"
    datatype: xsd:decimal

  - source: confidence
    target: "celine:hasConfidence"
    datatype: xsd:decimal

  - source: model_iri
    target: "sosa:usedProcedure"
    kind: iri

  - source: run_iri
    target: "celine:forecastRun"
    kind: iri

  # The location the forecast is about. Its coordinates live on this entity, as
  # geo:lat / geo:long, not restated on every forecast row.
  - source: feature_iri
    target: "sosa:hasFeatureOfInterest"
    kind: iri

  # Who supplied the underlying weather input. Distinct from sosa:usedProcedure,
  # which names the model that turned it into a yield.
  - source: provider
    target: "dct:source"
    datatype: xsd:string
