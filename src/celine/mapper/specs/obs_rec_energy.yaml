# ⚠ SUPERSEDED by obs_energy_measurement.yaml — do not bind new datasets to this.
#
# This spec maps a wide row onto a single sosa:Observation, which SSN forbids:
# an Observation carries exactly one sosa:observedProperty. The second and third
# quantities are therefore parked on `peco:has_quantity` and `rdf:value`, which
# are not "the second result" — they were reached for because the row had
# nowhere else to put the numbers. Nothing dereferences that and no test
# contradicts it.
#
# Kept, unbound, because the graph-builder tests and fixtures exercise it. The
# replacement takes one quantity per row from the `*_measurements_*` views in
# celine-pipelines. See obs_energy_measurement.yaml for the full reasoning.
#
# Maps rows from ds_dev_gold.rec_virtual_consumption_15m (and _hourly, which
# emits the same columns) to sosa:Observation nodes.
#
# Source columns: ts, rec_id, substation_id, total_consumption_kwh,
#                 total_production_kwh, self_consumption_kwh,
#                 self_consumption_ratio
#
# Corrected 2026-08-09. The previous version named `*_kw` columns against a table
# `ds_dev_gold.rec_virtual_consumption` that no longer exists — the models are now
# `_15m` / `_hourly` and emit `*_kwh`. That is not a rename: kW is power, kWh is
# energy, and `xsd:decimal` carries no unit to contradict a wrong reading. It also
# took `community_key` from the caller's context while the rows carry `rec_id` and
# `substation_id` of their own.
version: "1"

# The ontology profile whose shapes validate this mapping's output. Pinned,
# not left to resolve: a dataset bound to this spec asserts conformance
# against these shapes, and a later ontology release must not decide
# retroactively that it stopped conforming.
profile:
  name: celine
  version: v0.10
target_type: "sosa:Observation"

# Keyed on all three of (rec_id, substation_id, ts) because that is the model's
# own grain — `group by ts, rec_id, substation_id`. Dropping substation_id would
# mint one IRI for several distinct rows.
id_template: "https://w3id.org/celine/obs/rec-energy/{rec_id}/{substation_id}/{ts}"

fields:
  - source: ts
    target: "sosa:resultTime"
    datatype: xsd:dateTime
    required: true

  - source: self_consumption_kwh
    target: "sosa:hasSimpleResult"
    datatype: xsd:decimal

  - source: self_consumption_ratio
    target: "rdf:value"
    datatype: xsd:decimal

  - source: total_consumption_kwh
    target: "peco:has_quantity"
    datatype: xsd:decimal

  - source: total_production_kwh
    target: "peco:has_value"
    datatype: xsd:decimal

  # Feature of interest: the community. `rec_id` is a column on the row, so this
  # no longer needs a context variable supplied by the caller.
  - source: rec_id
    target: "sosa:hasFeatureOfInterest"
    kind: iri
    iri_template: "https://w3id.org/celine/rec/{value}"
    required: true

  # The substation the reading is aggregated under — part of the grain, so it is
  # stated rather than left implicit in the IRI.
  - source: substation_id
    target: "sosa:isFeatureOfInterestOf"
    kind: iri
    iri_template: "https://w3id.org/celine/substation/{value}"

  # Observed property: self-consumption, in energy units to match the column.
  - target: "sosa:observedProperty"
    kind: constant
    value: "https://w3id.org/celine/property/self-consumption-kwh"
