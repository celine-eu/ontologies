# Maps one row of a REC energy *forecast* view to a celine:Forecast.
#
# Rewritten 2026-09-03 for ontology v0.11, alongside obs_meter_forecast.yaml and
# obs_pv_forecast.yaml. The reasoning is the same and is written out in full in
# obs_meter_forecast.yaml: peco:Forecast carrying a sosa: property was a domain
# mismatch OWL-RL resolved silently, resultTime held the target instant rather than
# the run, and one row carried more than one quantity.
#
# ── The constant was wrong twice over ────────────────────────────────────────
# The previous version asserted
# `https://w3id.org/celine/property/rec-energy-forecast-kw` — an IRI in no
# namespace, and one naming **kW** where the models emit energy. kW is power and kWh
# is energy, and `xsd:decimal` carries no unit to contradict a wrong reading; this is
# the identical slip corrected in the metering specs on 2026-08-09, which the
# forecast specs never received.
#
# It is not replaced with a different constant. `observed_property` comes from a
# column, so the pipeline states which of the celine: observable properties a row
# carries — grid import for a community consumption forecast, collectively shared
# energy for a sharing forecast. Guessing here would produce a conformant graph of
# wrong statements, which is the failure mode SHACL cannot see.
#
# Columns no longer mapped: `period` restated the view's granularity, which the
# interval between rows already carries.
#
# Source columns: run_time, forecast_target_time, observed_property, value, unit,
#                 lower_bound, upper_bound, confidence, model_iri, run_iri,
#                 feature_iri
version: "2"

profile:
  name: celine
  version: v0.11

target_type: "celine:Forecast"

# The feature is in the IRI rather than a context variable: the previous version took
# `community_key` from the caller's context while the row carried its own keys, which
# is how the two get to disagree. Same correction the metering specs took.
id_template: "forecast/rec/{{ feature_key }}/{{ run_time }}/{{ forecast_target_time }}"

fields:
  - source: run_time
    target: "sosa:resultTime"
    datatype: xsd:dateTime
    required: true

  - source: forecast_target_time
    target: "celine:forecastTargetTime"
    datatype: xsd:dateTime
    required: true

  - source: observed_property
    target: "sosa:observedProperty"
    kind: iri
    required: true

  - source: value
    target: "sosa:hasSimpleResult"
    datatype: xsd:decimal

  - source: unit
    target: "qudt:hasUnit"
    kind: iri

  - source: lower_bound
    target: "celine:hasLowerBound"
    datatype: xsd:decimal

  - source: upper_bound
    target: "celine:hasUpperBound"
    datatype: xsd:decimal

  - source: confidence
    target: "celine:hasConfidence"
    datatype: xsd:decimal

  - source: model_iri
    target: "sosa:usedProcedure"
    kind: iri

  - source: run_iri
    target: "celine:forecastRun"
    kind: iri

  # The REC or sharing group the forecast is about, resolved to an IRI upstream so
  # the consumer is not left inferring it from whichever key happens to be non-null.
  - source: feature_iri
    target: "sosa:hasFeatureOfInterest"
    kind: iri
