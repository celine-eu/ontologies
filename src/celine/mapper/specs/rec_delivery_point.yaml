# Maps a DeliveryPointSchema dict (from rec-registry get_delivery_point_by_id()
# or embedded in MemberDetailSchema.delivery_points) to peco:Electric_POD.
# Migrated 2026-09-03 to spec format `version: "2"` (Jinja) with **relative**
# id/iri templates. Two changes, one edit, because both rewrite the same lines:
#
#   - Templates are Jinja (`{{ var }}`), rendered in a sandbox with StrictUndefined,
#     so a template naming a column the row does not carry now fails instead of
#     rendering an empty string into the middle of an IRI. The schema had claimed
#     these fields were Jinja since they were written; they were `str.format_map`.
#   - `id_template` and `iri_template` no longer hardcode `https://w3id.org/celine/`,
#     which is not a registered w3id namespace and answered 404 for every instance
#     IRI this spec ever emitted. The base is now the caller's (`base_uri`, set from
#     deployment configuration), because entities are named by the service that
#     serves them. **This changes every emitted IRI, which is the point.**
#
# `kind: constant` values are untouched and stay absolute: they name ontology
# *terms*, which belong to whoever publishes the vocabulary, not entities this
# mapping mints.
#
version: "2"

# The ontology profile whose shapes validate this mapping's output. Pinned,
# not left to resolve: a dataset bound to this spec asserts conformance
# against these shapes, and a later ontology release must not decide
# retroactively that it stopped conforming.
profile:
  name: celine
  version: v0.10
target_type: "peco:Electric_POD"
id_template: "pod/{{ id }}"

context_vars:
  - community_key
  - member_key

fields:
  - source: id
    target: "dct:identifier"
    datatype: xsd:string
    required: true

  - source: type
    target: "rdfs:comment"
    datatype: xsd:string

  - source: description
    target: "dct:description"
    datatype: xsd:string

  - source: address
    target: "peco:address"
    datatype: xsd:string

  - source: tariff
    target: "peco:has_tariff"
    datatype: xsd:string

  # active status (boolean)
  - source: active
    target: "peco:related_to_property"
    datatype: xsd:boolean

  # Link to owning member (member_key from context_vars)
  - target: "peco:is_port_of"
    kind: iri
    iri_template: "member/{{ member_key }}"
