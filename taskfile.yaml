version: "3"

tasks:
  verify:wheel:
    desc: >-
      Build the wheel and load every packaged ontology profile from a venv that
      is NOT this checkout. The suite cannot prove this: run from the repo root,
      profile resolution falls back to `specs/`, so "packaged correctly" and
      "found the source tree" look identical — which is exactly how the old
      `<site-packages>/specs/current` default survived until deployment.
    vars:
      OUT: '{{.OUT | default "/tmp/celine-ontologies-wheelcheck"}}'
    cmds:
      - |
        set -e
        rm -rf "{{.OUT}}"
        uv build --wheel -o "{{.OUT}}/dist"
        uv venv "{{.OUT}}/venv"
        uv pip install --python "{{.OUT}}/venv/bin/python" \
          "$(ls {{.OUT}}/dist/*.whl)[mapper]"
        # Run from /tmp: cwd must not be the checkout, or `specs/` is reachable
        # again through the fallback and the check proves nothing.
        cd "{{.OUT}}" && "{{.OUT}}/venv/bin/python" -c '
        from celine.mapper import GraphBuilder, MappingSpecLoader
        from celine.mapper.profiles import available_profiles, load_profile

        found = available_profiles()
        assert found.get("celine"), "no packaged celine profile in the wheel"
        for version in found["celine"]:
            profile = load_profile("celine", version)
            assert profile.source == "packaged", f"{version} resolved from {profile.source}"
            print("ok", profile)

        for name in MappingSpecLoader.available():
            spec = MappingSpecLoader().load_by_name(name)
            builder = GraphBuilder.for_spec(spec)
            result = builder.validate_shacl(builder.to_rdf_graph(builder.build_document([])))
            assert result.conforms, f"{name}: {result}"
        print("ok", len(MappingSpecLoader.available()), "specs resolve their pinned profile")
        '

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags

  widoco:docs:
    desc: "Generate WIDOCO HTML docs for a spec version (default: latest). Pass version as: task widoco:docs -- vX.X"
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            ls -d specs/*/ 2>/dev/null \
              | sed 's:/*$::' \
              | grep -v current \
              | sort -V \
              | tail -n 1 \
              | xargs basename
          fi
    cmds:
      - |
        set -e
        version="{{.VERSION}}"
        input="specs/$version/celine.ttl"
        output="releases/$version"

        if [ ! -f "$input" ]; then
          echo "Ontology file not found: $input"
          exit 1
        fi

        echo "Generating WIDOCO docs for $version..."
        rm -rf "$output"
        mkdir -p "$output"

        conf_flag=""
        if [ -f "specs/$version/widoco.conf" ]; then
          conf_flag="-confFile /usr/local/widoco/in/widoco.conf"
        fi

        cid=$(docker create \
          -v "$(pwd)/specs/$version:/usr/local/widoco/in:ro" \
          ghcr.io/dgarijo/widoco:v1.4.23 \
          -ontFile /usr/local/widoco/in/celine.ttl \
          -outFolder /tmp/out \
          -rewriteAll \
          -lang en \
          -includeAnnotationProperties \
          $conf_flag)

        docker start --attach "$cid"
        docker cp "$cid:/tmp/out/." "$output/"
        docker rm "$cid"

        echo "Docs generated at $output"

        if [ -d "specs/$version/sections" ]; then
          cp specs/$version/sections/*.html "$output/sections/"
          echo "Overlaid custom sections from specs/$version/sections/"
        fi

        if [ -f "specs/$version/README.md" ]; then
          cp "specs/$version/README.md" "$output/readme.md"
          echo "Copied specs/$version/README.md → $output/readme.md"
        fi

  widoco:serve:
    desc: "Serve WIDOCO HTML docs locally (default: latest). Pass version as: task widoco:serve -- vX.X"
    vars:
      VERSION:
        sh: |
          if [ -n "{{.CLI_ARGS}}" ]; then
            echo "{{.CLI_ARGS}}"
          else
            ls -d releases/*/ 2>/dev/null \
              | sed 's:/*$::' \
              | grep -v current \
              | sort -V \
              | tail -n 1 \
              | xargs basename
          fi
    cmds:
      - |
        set -e
        version="{{.VERSION}}"
        docroot="releases/$version"

        if [ ! -d "$docroot" ]; then
          echo "No docs found at $docroot — run 'task widoco:docs' first"
          exit 1
        fi

        echo "Serving $docroot at http://0.0.0.0:9902/"
        python3 -m http.server 9902 --bind 0.0.0.0 --directory "$docroot"

  release:ontology:
    deps: [widoco:docs]
    desc: Copy latest versioned spec into specs/current
    cmds:
      - |
        set -e
        echo "Detecting latest spec..."

        latest_dir=$(ls -d specs/*/ 2>/dev/null \
          | sed 's:/*$::' \
          | grep -v current \
          | sort -V \
          | tail -n 1)

        if [ -z "$latest_dir" ]; then
          echo "No spec directories found under specs/"
          exit 1
        fi

        latest=$(basename "$latest_dir")

        rm -rf specs/current
        cp -r "specs/$latest" specs/current
        echo "Copied specs/$latest → specs/current"

        if [ -d "releases/$latest" ]; then
          rm -rf releases/current
          cp -r "releases/$latest" releases/current
          echo "Copied releases/$latest → releases/current"
        fi

        git add .
        git commit -m "release ontology $latest" || true

        git tag -f "celine-ontology-$latest"
        git push --tags -f
        git push -f
