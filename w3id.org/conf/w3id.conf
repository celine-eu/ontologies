# Approximates how w3id.org serves a namespace.
#
# On the real host every namespace is a directory under one document root and
# its .htaccess is honoured, so the shape to reproduce is exactly that: the
# fork's celine-eu/ mounted as a directory, AllowOverride All, nothing else.
#
# This is what makes the local run faithful rather than merely convenient — it
# reproduces the mod_dir DirectorySlash 301 on /celine-eu that the production
# host also emits, which is a hop the redirect chain really has.

ServerName w3id.localhost

DocumentRoot "/var/www/w3id"

<Directory "/var/www/w3id">
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Keep the log on stdout so `task w3id:logs` shows something useful.
ErrorLog /proc/self/fd/2
LogLevel warn rewrite:trace3
